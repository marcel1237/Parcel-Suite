name: playos-resolute-k73
base: bare
build-base: ubuntu@26.04
version: '26.04-k73'
summary: PlayOS Resolute (Ubuntu 26) com Kernel Vanilla 7.3
description: |
  Esta imagem combina o userspace standard do Ubuntu 26.04 (Resolute)
  com o kernel de vanguarda Linux 7.3 customizado.

platforms:
  amd64:

volumes:
  disk:
    schema: gpt
    structure:
      - name: efi
        role: system-boot
        type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B # EFI System Partition UUID
        size: 256M
        filesystem: vfat
      - name: rootfs
        role: system-data
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4 # Linux root (x86-64) UUID
        size: 12G
        filesystem: ext4
        filesystem-label: root

filesystems:
  default:
    - device: (volume/disk/rootfs)
      mount: /
    - device: (volume/disk/efi)
      mount: /boot/efi

parts:
  # 1. Bootstrap e Instalação (Tudo em um passo para evitar erros de overlay)
  playos-system:
    plugin: nil
    override-build: |
      # Criar o rootfs básico usando mmdebstrap direto no diretório de instalação
      mmdebstrap --suite=resolute $CRAFT_PART_INSTALL http://archive.ubuntu.com/ubuntu/
      
      # Entrar no chroot para instalar o kernel e o desktop
      mount -t proc proc $CRAFT_PART_INSTALL/proc
      mount -t sysfs sys $CRAFT_PART_INSTALL/sys
      mount --bind /dev $CRAFT_PART_INSTALL/dev
      mount --bind /run $CRAFT_PART_INSTALL/run

      # Copiar o kernel para dentro do chroot temporariamente
      mkdir -p $CRAFT_PART_INSTALL/tmp/kernel
      cp $CRAFT_PROJECT_DIR/kernel/*.deb $CRAFT_PART_INSTALL/tmp/kernel/

      # Executar comandos dentro do chroot
      chroot $CRAFT_PART_INSTALL bash -c "
        # Habilitar repositórios
        apt-get update
        apt-get install -y software-properties-common
        add-apt-repository -y universe
        add-apt-repository -y restricted
        add-apt-repository -y multiverse
        apt-get update
        
        # Instalar o Kernel Customizado
        dpkg -i /tmp/kernel/*.deb
        apt-mark hold linux-image-unsigned-7.3.0-070300rc3-generic linux-modules-7.3.0-070300rc3-generic
        
        # Instalar Desktop
        apt-get install -y --no-install-recommends ubuntu-desktop grub-efi-amd64 sudo
        
        # Criar usuário
        useradd -m -s /bin/bash -G sudo playos
        echo 'playos:playos' | chpasswd
        
        # Limpeza
        rm -rf /tmp/kernel
      "

      # Desmontar tudo
      umount $CRAFT_PART_INSTALL/run
      umount $CRAFT_PART_INSTALL/dev
      umount $CRAFT_PART_INSTALL/sys
      umount $CRAFT_PART_INSTALL/proc
