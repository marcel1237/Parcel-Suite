name: playos-resolute-k73
base: bare
build-base: ubuntu@24.04
version: '26.04-k73'
summary: PlayOS Resolute (Ubuntu 26) com Kernel Vanilla 7.3
description: |
  Esta imagem combina o userspace standard do Ubuntu 26.04 (Resolute)
  com o kernel de vanguarda Linux 7.3 customizado.

platforms:
  amd64:

volumes:
  disk:
    schema: gpt
    structure:
      - name: efi
        role: system-boot
        type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B # EFI System Partition UUID
        size: 256M
        filesystem: vfat
      - name: rootfs
        role: system-data
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4 # Linux root (x86-64) UUID
        size: 12G
        filesystem: ext4
        filesystem-label: root

filesystems:
  default:
    - device: (volume/disk/rootfs)
      mount: /
    - device: (volume/disk/efi)
      mount: /boot/efi

parts:
  playos-system:
    plugin: nil
    override-build: |
      # Criar o rootfs básico usando mmdebstrap (usando Noble para garantir pacotes existentes)
      mmdebstrap noble "$CRAFT_PART_INSTALL" http://archive.ubuntu.com/ubuntu/
      
      # Garantir diretórios essenciais
      mkdir -p "$CRAFT_PART_INSTALL/boot/efi"
      mkdir -p "$CRAFT_PART_INSTALL/run"
      mkdir -p "$CRAFT_PART_INSTALL/dev"
      mkdir -p "$CRAFT_PART_INSTALL/proc"
      mkdir -p "$CRAFT_PART_INSTALL/sys"
      
      # FIX NETWORKING: Copiar resolv.conf do host para o chroot
      cp /etc/resolv.conf "$CRAFT_PART_INSTALL/etc/resolv.conf"

      # Copiar o kernel para dentro do chroot
      mkdir -p "$CRAFT_PART_INSTALL/tmp/kernel"
      cp "$CRAFT_PROJECT_DIR/kernel/"*.deb "$CRAFT_PART_INSTALL/tmp/kernel/"

      # Montar sistemas de arquivos virtuais
      mount -t proc proc "$CRAFT_PART_INSTALL/proc"
      mount -t sysfs sys "$CRAFT_PART_INSTALL/sys"
      mount --bind /dev "$CRAFT_PART_INSTALL/dev"
      mount --bind /run "$CRAFT_PART_INSTALL/run"
      
      # Executar comandos dentro do chroot com tratamento de erro
      chroot "$CRAFT_PART_INSTALL" bash -ex <<EOF
        apt-get update
        
        # Instalar dependências básicas ANTES do kernel
        apt-get install -y linux-base wireless-regdb zstd initramfs-tools kmod
        
        # Instalar o Kernel Customizado
        dpkg -i /tmp/kernel/*.deb
        
        # FORÇAR GERAÇÃO DO INITRD
        KVER=\$(ls /boot/vmlinuz-* | sed 's/.*vmlinuz-//' | head -n 1)
        update-initramfs -c -k "\$KVER"
        
        # Impedir atualização do kernel
        apt-mark hold linux-image-unsigned-7.3.0-070300rc3-generic linux-modules-7.3.0-070300rc3-generic
        
        # Instalar Desktop e ferramentas de bootloader
        apt-get install -y --no-install-recommends ubuntu-desktop grub-efi-amd64 sudo
        
        # Configurar usuário
        if ! id -u playos >/dev/null 2>&1; then
          useradd -m -s /bin/bash -G sudo playos
        fi
        echo 'playos:playos' | chpasswd
        
        # Gerar o fstab básico
        echo 'LABEL=root / ext4 defaults 0 1' > /etc/fstab
        echo 'UUID=C12A-7328 /boot/efi vfat defaults 0 2' >> /etc/fstab
        
        # Limpeza interna
        rm -rf /tmp/kernel
EOF

      # Desmontar tudo
      umount "$CRAFT_PART_INSTALL/run"
      umount "$CRAFT_PART_INSTALL/dev"
      umount "$CRAFT_PART_INSTALL/sys"
      umount "$CRAFT_PART_INSTALL/proc"
      
      # Criar diretório de montagem fake para o finalizador de boot do imagecraft
      mkdir -p "$CRAFT_PROJECT_DIR/mount/boot/efi"
