name: playos-resolute-k73
base: bare
build-base: ubuntu@24.04 # Mantemos 24.04 pois 26.04 ainda não existe como build-base estável no imagecraft
version: '26.04-k73'
summary: PlayOS Resolute (Ubuntu 26) com Kernel Vanilla 7.3
description: |
  Esta imagem combina o userspace standard do Ubuntu 26.04 (Resolute)
  com o kernel de vanguarda Linux 7.3 customizado.

platforms:
  amd64:

volumes:
  disk:
    schema: gpt
    structure:
      - name: efi
        role: system-boot
        type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B # EFI System Partition UUID
        size: 256M
        filesystem: vfat
      - name: rootfs
        role: system-data
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4 # Linux root (x86-64) UUID
        size: 12G
        filesystem: ext4
        filesystem-label: root

filesystems:
  default:
    - device: (volume/disk/rootfs)
      mount: /
    - device: (volume/disk/efi)
      mount: /boot/efi

parts:
  # 1. Bootstrap do Ubuntu 26 (Resolute)
  system-root:
    plugin: mmdebstrap
    mmdebstrap-suite: noble
    # mmdebstrap-suite: resolute

  # 2. Injeção do Kernel 7.3 Customizado
  custom-kernel:
    after: [system-root]
    plugin: dump
    source: ./kernel/
    override-overlay: |
      # Instalar o kernel customizado via dpkg
      dpkg -i $CRAFT_PART_SRC/*.deb
      # Impedir atualização do kernel
      apt-mark hold linux-image-unsigned-7.3.0-070300rc3-generic
      apt-mark hold linux-modules-7.3.0-070300rc3-generic

  # 3. Instalação do Desktop
  ubuntu-desktop:
    after: [custom-kernel]
    plugin: nil
    override-overlay: |
      add-apt-repository -y universe
      add-apt-repository -y restricted
      add-apt-repository -y multiverse
      apt-get update
      # Instala o desktop standard sem forçar o kernel oficial
      apt-get install -y --no-install-recommends ubuntu-desktop grub-efi-amd64

  # 4. Configuração do Usuário
  setup-user:
    after: [ubuntu-desktop]
    plugin: nil
    override-overlay: |
      useradd -m -s /bin/bash -G sudo playos
      echo "playos:playos" | chpasswd
      update-grub
