# Parcel Play OS - seletor híbrido de 11 kernels/sistemas
# Gerado inicialmente para o MVP Resolute. Não declarar um payload pronto sem
# kernel+initrd (Linux) ou loader EFI (BSD) presente no caminho contratado.

set default=0
set timeout=30

loadfont unicode
set gfxmode=auto
set gfxpayload=keep
terminal_output gfxterm

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set parcel_iso_arg=""
if [ -n "$iso_path" ]; then
    set parcel_iso_arg="iso-scan/filename=${iso_path}"
fi

function parcel_missing_linux {
    echo "Payload Linux ainda não integrado."
    echo "Necessários: $1 e $2"
    echo "Pressione Esc para retornar ou aguarde."
    sleep --interruptible 5
}

function parcel_missing_bsd {
    echo "Payload/loader EFI BSD ainda não integrado."
    echo "Necessário: $1"
    echo "Pressione Esc para retornar ou aguarde."
    sleep --interruptible 5
}

menuentry "1. PlayOS Baseline 26.04 Resolute — Live/Instalar" --id playos-baseline {
    linux /casper/vmlinuz ${parcel_iso_arg} --- quiet splash parcel.kernel=playos
    initrd /casper/initrd
}

if [ -f /parcel/linux/arch/vmlinuz -a -f /parcel/linux/arch/initrd ]; then
    menuentry "2. NitroCore Arch — Live/Instalar" --id parcel-arch {
        linux /parcel/linux/arch/vmlinuz ${parcel_iso_arg} --- quiet splash parcel.kernel=arch
        initrd /parcel/linux/arch/initrd
    }
else
    menuentry "2. NitroCore Arch — [payload indisponível]" --id parcel-arch-missing {
        parcel_missing_linux /parcel/linux/arch/vmlinuz /parcel/linux/arch/initrd
    }
fi

if [ -f /parcel/linux/opensuse/vmlinuz -a -f /parcel/linux/opensuse/initrd ]; then
    menuentry "3. NitroCore openSUSE — Live/Instalar" --id parcel-opensuse {
        linux /parcel/linux/opensuse/vmlinuz ${parcel_iso_arg} --- quiet splash parcel.kernel=opensuse
        initrd /parcel/linux/opensuse/initrd
    }
else
    menuentry "3. NitroCore openSUSE — [payload indisponível]" --id parcel-opensuse-missing {
        parcel_missing_linux /parcel/linux/opensuse/vmlinuz /parcel/linux/opensuse/initrd
    }
fi

if [ -f /parcel/linux/fedora/vmlinuz -a -f /parcel/linux/fedora/initrd ]; then
    menuentry "4. NitroCore Fedora — Live/Instalar" --id parcel-fedora {
        linux /parcel/linux/fedora/vmlinuz ${parcel_iso_arg} --- quiet splash parcel.kernel=fedora
        initrd /parcel/linux/fedora/initrd
    }
else
    menuentry "4. NitroCore Fedora — [payload indisponível]" --id parcel-fedora-missing {
        parcel_missing_linux /parcel/linux/fedora/vmlinuz /parcel/linux/fedora/initrd
    }
fi

if [ -f /EFI/parcel/freebsd/loader.efi ]; then
    menuentry "5. FreeBSD — Live/Instalador nativo" --id parcel-freebsd {
        if [ "$grub_platform" = "efi" ]; then
            insmod chain
            chainloader /EFI/parcel/freebsd/loader.efi
        else
            echo "O MVP FreeBSD requer inicialização UEFI."
            sleep --interruptible 5
        fi
    }
else
    menuentry "5. FreeBSD — [payload indisponível]" --id parcel-freebsd-missing {
        parcel_missing_bsd /EFI/parcel/freebsd/loader.efi
    }
fi

if [ -f /parcel/linux/debian/vmlinuz -a -f /parcel/linux/debian/initrd ]; then
    menuentry "6. NitroCore Debian — Live/Instalar" --id parcel-debian {
        linux /parcel/linux/debian/vmlinuz ${parcel_iso_arg} --- quiet splash parcel.kernel=debian
        initrd /parcel/linux/debian/initrd
    }
else
    menuentry "6. NitroCore Debian — [payload indisponível]" --id parcel-debian-missing {
        parcel_missing_linux /parcel/linux/debian/vmlinuz /parcel/linux/debian/initrd
    }
fi

if [ -f /parcel/linux/gentoo/vmlinuz -a -f /parcel/linux/gentoo/initrd ]; then
    menuentry "7. NitroCore Gentoo — Live/Instalar" --id parcel-gentoo {
        linux /parcel/linux/gentoo/vmlinuz ${parcel_iso_arg} --- quiet splash parcel.kernel=gentoo
        initrd /parcel/linux/gentoo/initrd
    }
else
    menuentry "7. NitroCore Gentoo — [payload indisponível]" --id parcel-gentoo-missing {
        parcel_missing_linux /parcel/linux/gentoo/vmlinuz /parcel/linux/gentoo/initrd
    }
fi

if [ -f /EFI/parcel/netbsd/bootx64.efi ]; then
    menuentry "8. NetBSD — Live/Instalador nativo" --id parcel-netbsd {
        if [ "$grub_platform" = "efi" ]; then
            insmod chain
            chainloader /EFI/parcel/netbsd/bootx64.efi
        else
            echo "O MVP NetBSD requer inicialização UEFI."
            sleep --interruptible 5
        fi
    }
else
    menuentry "8. NetBSD — [payload indisponível]" --id parcel-netbsd-missing {
        parcel_missing_bsd /EFI/parcel/netbsd/bootx64.efi
    }
fi

if [ -f /EFI/parcel/openbsd/BOOTX64.EFI ]; then
    menuentry "9. OpenBSD — Instalador/Recuperação nativo" --id parcel-openbsd {
        if [ "$grub_platform" = "efi" ]; then
            insmod chain
            chainloader /EFI/parcel/openbsd/BOOTX64.EFI
        else
            echo "O MVP OpenBSD requer inicialização UEFI."
            sleep --interruptible 5
        fi
    }
else
    menuentry "9. OpenBSD — [payload indisponível]" --id parcel-openbsd-missing {
        parcel_missing_bsd /EFI/parcel/openbsd/BOOTX64.EFI
    }
fi

if [ -f /parcel/linux/centos/vmlinuz -a -f /parcel/linux/centos/initrd ]; then
    menuentry "10. NitroCore CentOS — Live/Instalar" --id parcel-centos {
        linux /parcel/linux/centos/vmlinuz ${parcel_iso_arg} --- quiet splash parcel.kernel=centos
        initrd /parcel/linux/centos/initrd
    }
else
    menuentry "10. NitroCore CentOS — [payload indisponível]" --id parcel-centos-missing {
        parcel_missing_linux /parcel/linux/centos/vmlinuz /parcel/linux/centos/initrd
    }
fi

if [ -f /parcel/linux/oracle/vmlinuz -a -f /parcel/linux/oracle/initrd ]; then
    menuentry "11. NitroCore Oracle — Live/Instalar" --id parcel-oracle {
        linux /parcel/linux/oracle/vmlinuz ${parcel_iso_arg} --- quiet splash parcel.kernel=oracle
        initrd /parcel/linux/oracle/initrd
    }
else
    menuentry "11. NitroCore Oracle — [payload indisponível]" --id parcel-oracle-missing {
        parcel_missing_linux /parcel/linux/oracle/vmlinuz /parcel/linux/oracle/initrd
    }
fi

submenu "Opções avançadas e recuperação" --id parcel-advanced {
    menuentry "PlayOS Baseline — gráficos seguros" --id playos-baseline-safe {
        linux /casper/vmlinuz nomodeset ${parcel_iso_arg} --- quiet splash parcel.kernel=playos
        initrd /casper/initrd
    }

    if [ "$grub_platform" = "efi" ]; then
        menuentry "Iniciar pelo próximo volume" --id parcel-next-volume {
            exit 1
        }
        menuentry "Configurações do firmware UEFI" --id parcel-fwsetup {
            fwsetup
        }
    fi
}
