# ==============================================================================
# Menu de Boot GRUB2 — Live ISO Angel OS KDE-Full
# ==============================================================================

set default=0
set timeout=5

insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod all_video

menuentry "Angel OS KDE-Full (Live Boot - Plasma Wayland)" {
    linux /boot/vmlinuz-7.3-seraphin quiet splash angelos.profile=kde-full
    initrd /boot/initramfs.img
}

menuentry "Angel OS KDE-Full (Modo Seguro / VESA Display)" {
    linux /boot/vmlinuz-7.3-seraphin nomodeset angelos.profile=safe
    initrd /boot/initramfs.img
}

menuentry "Angel OS (Console / Recovery Mode)" {
    linux /boot/vmlinuz-7.3-seraphin 3
    initrd /boot/initramfs.img
}
